<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy birthday!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="pops" aria-hidden="true"></div>

  <main>
    <!-- 1. Intro -->
    <section class="scene" id="intro">
      <p class="lead">Psst, <span class=""></span>…</p>
      <h1 class="display intro-title">Made you something.</h1>
      <button class="btn" id="startBtn">Let's see</button>
      <p class="tip">Tip: click anywhere on the page.</p>
    </section>

    <!-- 2a. Pop the balloons -->
    <section class="scene hidden" id="balloonScene">
      <p class="hint" id="balloonHint"></p>
      <div class="balloons" id="balloons"></div>
    </section>

    <!-- 2b. Scratch card -->
    <section class="scene hidden" id="scratchScene">
      <p class="hint">You've got a lucky day today, <span class="name"></span>. Scratch to see.</p>
      <div class="ticket" id="ticket">
        <div class="ticket-prize">
          <p class="ticket-label">Today's prize</p>
          <p class="display ticket-text">Happy birthdayy, <span class="name"></span>!</p>
        </div>
        <canvas id="scratch" aria-hidden="true"></canvas>
      </div>
      <button class="link-btn" id="revealBtn">Can't scratch? Reveal it</button>
    </section>

    <!-- 2c. Unwrap the box -->
    <section class="scene hidden" id="boxScene">
      <p class="hint">This box has been shaking all morning. Better open it.</p>
      <div class="box" id="box" aria-hidden="true">
        <div class="bow"><span></span><span></span></div>
        <div class="lid"></div>
        <div class="base"></div>
      </div>
      <button class="btn" id="ribbonBtn">Pull the ribbon</button>
    </section>

    <!-- 3. The party -->
    <section class="scene hidden" id="party">
      <h1 class="display big" id="bigTitle"></h1>
      <a class="btn gift-btn" href="gift.html" target="_blank" rel="noopener">Claim your gift</a>
      <div class="actions">
        <button class="btn ghost" id="songBtn">Play the song</button>
        <button class="btn ghost" id="againBtn">Start again</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
